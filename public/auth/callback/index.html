<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Completing Sign-In — IronPulse Gym</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090b0e;
        color: #f3f5f7;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: #11151b;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        color: #c8ff00;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Signing you in…</h1>
      <p>Completing Google authentication. This window will close automatically.</p>
    </div>
    <script>
      (function () {
        var payload = {
          type: 'SUPABASE_OAUTH_CALLBACK',
          search: window.location.search || '',
          hash: window.location.hash || ''
        };
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(payload, window.location.origin);
          } catch (e) {
            window.opener.postMessage(payload, '*');
          }
          setTimeout(function () {
            window.close();
          }, 150);
        } else {
          window.location.replace('/' + payload.search + payload.hash);
        }
      })();
    </script>
  </body>
</html>
